<!doctype html>
<meta charset="utf-8">
<title>discussed-elsewhere example</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
  .spacer { height: 150vh; border-left: 2px dashed #ccc; padding-left: 1rem; color: #888; }
  .loading, .empty, .is-error { color: #888; }
</style>
<script type="module" src="../src/discussed-elsewhere.js"></script>
<h1>discussed-elsewhere</h1>
<p>The first box looks up at once; the second waits until it comes within 300px of the viewport.</p>
<h2>Eager</h2>
<discussed-elsewhere url="https://dawidwrobel.com/journal/initializing-lte-modem-using-raw-usb-communication/"></discussed-elsewhere>
<div class="spacer">(article body)</div>
<h2>Lazy</h2>
<discussed-elsewhere url="https://dawidwrobel.com/journal/initializing-lte-modem-using-raw-usb-communication/" loading="lazy"></discussed-elsewhere>
<script>
  document.addEventListener("settled", (e) => console.log("settled", e.target, e.detail));
</script>
