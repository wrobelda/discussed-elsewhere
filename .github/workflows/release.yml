# Release when a version tag is pushed: publish to npm, unless that version
# is already there, then create the GitHub Release for the tag. Publishing
# uses npm's trusted publishing: the job presents a short-lived OIDC token,
# so no npm token is stored, and the package gets provenance. One-time setup
# on npmjs.com after the first, manual publish: package settings, Trusted
# Publisher, GitHub Actions, this repository and this workflow file name.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # the GitHub Release
  id-token: write # npm trusted publishing
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or newer
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} but package.json says ${version}"; exit 1; }
          if npm view "discussed-elsewhere@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${version} is already on npm; not publishing again"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        run: npm publish --provenance --access public
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" \
            --notes "discussed-elsewhere ${version} on npm: https://www.npmjs.com/package/discussed-elsewhere/v/${version}"
